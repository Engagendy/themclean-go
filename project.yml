name: theMCleanGo
options:
  bundleIdPrefix: com.engagendy
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: 1.1.0
  CURRENT_PROJECT_VERSION: 2
  DEVELOPMENT_TEAM: 7JM77223V5
packages: {}
schemes:
  theMCleanGo:
    build:
      targets:
        theMCleanGo: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  theMCleanGo:
    type: application
    platform: iOS
    sources:
      - path: theMCleanGo
    resources:
      - path: theMCleanGo/Resources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.engagendy.theMCleanGo
      PRODUCT_NAME: theMClean Go
      INFOPLIST_FILE: theMCleanGo/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: false
      CODE_SIGN_ENTITLEMENTS: theMCleanGo/Resources/theMCleanGo.entitlements
    info:
      path: theMCleanGo/Resources/Info.plist
      properties:
        CFBundleDisplayName: theMClean Go
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: theMClean Go scans your photo library so you can review large photos and videos and free up space. Everything stays on your device.
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
